name: Deploy Harrison Garden

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harrison-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Angular 17 supports Node.js 20.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build -- --configuration production

      - name: Verify deployment inputs
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -s dist/aurick/index.html
          if [ -z "$FTP_PASSWORD" ]; then
            echo '::error::Set the FTP_PASSWORD repository secret before deploying.'
            exit 1
          fi

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.harrisongarden.com
          username: deploy@harrisongarden.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/aurick/
          # Relative to the FTP account's login directory.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
